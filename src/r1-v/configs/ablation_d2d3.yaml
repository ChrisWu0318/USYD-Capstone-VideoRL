# 消融 Step 2: Baseline + 维度二 + 维度三
# 预期: completion length 分布更规范, V-shape 出现

experiment_name: ablation_d2d3
experiment_tag: d2d3-v1
description: "Baseline + Token-Clipped KL + Task-Aware Length Penalty"
seed: 42

# 维度二: ON
enable_token_clipped_kl: true
kl_d_max: 5.0

# 维度三: ON
enable_length_penalty: true
length_min_mcq: 50
length_max_mcq: 256
length_min_open: 200
length_max_open: 600
length_penalty_alpha: 0.001
length_penalty_beta: 0.0005
welford_sigma_prior: 100.0
welford_k_prior: 50
welford_warmup_steps: 50

# D3 开启时必须关闭原始 len_control, 避免 double-penalty
override_len_control: false

# 维度一: OFF
enable_causal_reward: false
